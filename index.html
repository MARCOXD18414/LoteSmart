      <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th class="hide-sm">Alta</th><th class="num">Acciones</th></tr></thead><tbody id="rowsU">${loadingRow(6)}</tbody></table></div></div>
    <div class="card"><div class="card-head"><h2>Permisos por rol</h2><span class="muted">Marca o desmarca: se guarda al momento</span></div>
      <div class="table-wrap"><table class="matriz"><thead id="headM"></thead><tbody id="rowsM">${loadingRow(5)}</tbody></table></div></div>`;
  const marca = view.firstElementChild;
  let usuarios = [], roles = [], permisos = [], rp = new Set();
  const cargar = async () => {
    try {
      [usuarios, roles, permisos] = await Promise.all([
        db.list('usuario', { order: 'nombre.asc' }), db.list('rol', { order: 'id_rol.asc' }), db.list('permiso', { order: 'orden.asc' })]);
      rp = new Set((await db.list('rol_permiso')).map((x) => x.id_rol + '|' + x.permiso));
    } catch (e) { if (marca.isConnected) $('#rowsU').innerHTML = emptyRow(6, 'No se pudo cargar', ' ' + e.message); return; }
    if (!marca.isConnected) return;
    const rolNombre = (id) => (roles.find((r) => r.id_rol === id) || {}).nombre || '—';
    $('#cuentaU').textContent = pl(usuarios.length, 'usuario', 'usuarios');
    $('#rowsU').innerHTML = usuarios.map((u) => `<tr class="${u.activo ? '' : 'off'}" data-id="${u.id_usuario}">
      <td><div class="prod-cell"><span class="avatar" style="width:28px;height:28px;font-size:.7rem">${esc(iniciales(u.nombre))}</span><b>${esc(u.nombre)}</b>${u.email === (auth.user && auth.user.email) ? ' <span class="tag" style="background:var(--accent-soft);color:var(--accent-strong)">Tú</span>' : ''}</div></td>
      <td class="mono nw">${esc(u.email)}</td>
      <td><select class="input" data-rol style="min-width:150px" aria-label="Rol de ${esc(u.nombre)}">${roles.map((r) => `<option value="${r.id_rol}"${r.id_rol === u.id_rol ? ' selected' : ''}>${esc(r.nombre)}</option>`).join('')}</select></td>
      <td>${!u.auth_id ? pill('AMARILLO', 'Pendiente') : pill(u.activo ? 'ACTIVO' : 'BAJA', u.activo ? 'Activo' : 'Desactivado')}</td>
      <td class="hide-sm nw">${fecha(u.creado_en)}</td>
      <td><div class="row-actions">${btn('nombre', 'Editar nombre', 'edit')}${!u.auth_id ? btn('eliminarU', 'Eliminar alta', 'trash', 'danger') : u.activo ? btn('desactivar', 'Desactivar', 'ban', 'danger') : btn('activar', 'Activar', 'restore')}</div></td></tr>`).join('');
    $('#headM').innerHTML = `<tr><th>Permiso</th>${roles.map((r) => `<th class="center" title="${esc(r.descripcion || '')}">${esc(r.nombre)}</th>`).join('')}</tr>`;
    $('#rowsM').innerHTML = permisos.map((p) => `<tr><td>${esc(p.descripcion)}</td>${roles.map((r) => {
      const fijo = r.clave === 'ADMIN' && p.clave === 'usuarios.administrar';
      return `<td class="center"><input type="checkbox" data-rp="${r.id_rol}|${p.clave}"${rp.has(r.id_rol + '|' + p.clave) ? ' checked' : ''}${fijo ? ' disabled title="El Administrador siempre conserva este permiso"' : ''} aria-label="${esc(r.nombre)}: ${esc(p.descripcion)}"></td>`;
    }).join('')}</tr>`).join('');
  };
  const guardar = async (u, cambios, ok) => {
    const d = { ...u, ...cambios };
    try {
      await db.rpc('usuario_actualizar', conUsuario({ p_id_usuario: u.id_usuario, p_nombre: d.nombre, p_id_rol: Number(d.id_rol), p_activo: d.activo }));
      toast(ok);
      if (u.email === (auth.user && auth.user.email)) { await cargarPerfil(); pintaNav(); pintaPie(); if (!puede('usuarios.administrar')) { location.hash = '#' + inicio()[0]; return; } }
    } catch (e) { fallo(e); }
    cargar();
  };
  $('#rowsU').addEventListener('change', (e) => {
    const sel = e.target.closest('[data-rol]'); if (!sel) return;
    const u = usuarios.find((x) => String(x.id_usuario) === sel.closest('tr').dataset.id);
    guardar(u, { id_rol: Number(sel.value) }, `${u.nombre} ahora es ${sel.selectedOptions[0].textContent}.`);
  });
  $('#rowsU').addEventListener('click', async (e) => {
    const a = e.target.closest('[data-action]'); if (!a) return;
    const u = usuarios.find((x) => String(x.id_usuario) === a.closest('tr').dataset.id);
    if (a.dataset.action === 'nombre') {
      formModal({ title: 'Nombre de ' + u.email, okLabel: 'Guardar', fields: [{ name: 'nombre', label: 'Nombre (así firma en ventas y auditoría)', required: true, minLen: 2, max: 80, full: true }],
        values: { nombre: u.nombre }, onSubmit: async (d) => { await guardar(u, { nombre: d.nombre }, 'Nombre actualizado.'); } });
    }
    if (a.dataset.action === 'desactivar') {
      if (!await confirmar({ title: 'Desactivar usuario', message: `<b>${esc(u.nombre)}</b> ya no podrá ver ni registrar nada en LoteSmart. Su historial se conserva y puedes reactivarlo cuando quieras.`, okLabel: 'Desactivar', danger: true })) return;
      guardar(u, { activo: false }, `${u.nombre} desactivado.`);
    }
    if (a.dataset.action === 'activar') guardar(u, { activo: true }, `${u.nombre} activado.`);
    if (a.dataset.action === 'eliminarU') {
      if (!await confirmar({ title: 'Eliminar alta pendiente', message: `Se borrará el alta de <b>${esc(u.nombre)}</b> (${esc(u.email)}). Todavía no había entrado nunca a LoteSmart.`, okLabel: 'Eliminar', danger: true })) return;
      try { await db.rpc('usuario_eliminar', conUsuario({ p_id_usuario: u.id_usuario })); toast('Alta eliminada.'); } catch (err) { fallo(err); }
      cargar();
    }
  });
  // Alta de usuarios: el administrador elige correo, nombre, rol y una contraseña temporal.
  $('#btnNuevoU').addEventListener('click', () => {
    const temporal = 'Lote-' + Math.random().toString(36).slice(2, 6) + Math.floor(100 + Math.random() * 900);
    formModal({ title: 'Nuevo usuario', okLabel: 'Dar de alta',
      notice: 'La persona entrará con este correo y la contraseña temporal. Después puede cambiarla en <b>Mi cuenta</b>.',
      fields: [
        { name: 'nombre', label: 'Nombre completo (así firmará)', required: true, minLen: 3, max: 80, full: true, placeholder: 'Luis Pérez' },
        { name: 'email', label: 'Correo', type: 'email', required: true, max: 160, full: true, pattern: /^[^@\s]+@[^@\s]+\.[^@\s]+$/, patternMsg: 'Escribe un correo válido.' },
        { name: 'id_rol', label: 'Rol', type: 'select', required: true, options: async () => roles.map((r) => [r.id_rol, r.nombre + (r.descripcion ? ' · ' + r.descripcion : '')]) },
        { name: 'password', label: 'Contraseña temporal', required: true, minLen: 6, max: 72, mono: true, value: temporal, help: 'Mínimo 6 caracteres. Cópiala para dársela a la persona.' }
      ],
      values: { id_rol: (roles.find((r) => r.clave === 'VENDEDOR') || roles[0] || {}).id_rol },
      onSubmit: async (d) => {
        const email = d.email.toLowerCase();
        await db.rpc('usuario_crear', conUsuario({ p_email: email, p_nombre: d.nombre, p_id_rol: Number(d.id_rol) }));
        let estado = 'lista', detalle = '';
        try {
          const r = await auth.crearCuenta(email, d.password, d.nombre);
          if (!r.lista && r.confirmar) estado = 'confirmar';
        } catch (err) {
          if (/ya existe una cuenta/i.test(err.message)) estado = 'existia';
          else if (/desactivado/i.test(err.message)) estado = 'sinregistro';
          else { estado = 'error'; detalle = err.message; }
        }
        await cargar();
        const rol = (roles.find((r) => String(r.id_rol) === String(d.id_rol)) || {}).nombre;
        const msg = {
          lista: `La cuenta está lista. Comparte estos datos con <b>${esc(d.nombre)}</b>:`,
          confirmar: `Le enviamos un correo a <b>${esc(email)}</b> para confirmar la cuenta. Cuando la confirme, entra con:`,
          existia: `Esa persona ya tenía cuenta en Supabase: quedó ligada con el rol ${esc(rol)}. Entra con su contraseña de siempre.`,
          sinregistro: `El alta quedó guardada, pero en Supabase está desactivado el registro de cuentas. Crea la cuenta en <b>Authentication → Users → Add user</b> con el correo <b>${esc(email)}</b> y quedará ligada sola.`,
          error: `El alta quedó guardada, pero no se pudo crear la cuenta (${esc(detalle)}). Puedes crearla en Supabase → Authentication → Users con el mismo correo.`
        }[estado];
        const datos = ['lista', 'confirmar'].includes(estado);
        setTimeout(() => {
          const ov = openModal({ title: 'Usuario dado de alta', size: 'sm',
            body: `<p style="margin:0">${msg}</p>${datos ? `<dl class="facts" style="grid-template-columns:1fr"><div><dt>Correo</dt><dd class="mono">${esc(email)}</dd></div>
              <div><dt>Contraseña temporal</dt><dd class="mono">${esc(d.password)}</dd></div><div><dt>Rol</dt><dd>${esc(rol)}</dd></div>
              <div><dt>Dirección</dt><dd class="mono">${esc(location.origin + location.pathname)}</dd></div></dl>` : ''}`,
            foot: `${datos ? `<button class="btn" type="button" id="copiarU">${icon('log')}Copiar datos</button>` : ''}<button class="btn primary" type="button" data-close>Listo</button>` });
          if ($('#copiarU', ov)) $('#copiarU', ov).addEventListener('click', async () => {
            const t = `LoteSmart\nDirección: ${location.origin + location.pathname}\nCorreo: ${email}\nContraseña temporal: ${d.password}\nRol: ${rol}`;
            try { await navigator.clipboard.writeText(t); toast('Datos copiados.'); } catch { toast('Selecciona y copia los datos manualmente.', true); }
          });
        }, 50);
      } });
  });
  $('#rowsM').addEventListener('change', async (e) => {
    const cb = e.target.closest('[data-rp]'); if (!cb) return;
    const [idRol, permiso] = cb.dataset.rp.split('|');
    cb.disabled = true;
    try {
      await db.rpc('rol_permiso_cambiar', conUsuario({ p_id_rol: Number(idRol), p_permiso: permiso, p_conceder: cb.checked }));
      const r = roles.find((x) => String(x.id_rol) === idRol), p = permisos.find((x) => x.clave === permiso);
      toast(`${r.nombre}: ${cb.checked ? 'puede' : 'ya no puede'} ${p.descripcion.toLowerCase()}.`);
      if (auth.perfil && auth.perfil.rol === r.clave) { await cargarPerfil(); pintaNav(); }
    } catch (err) { cb.checked = !cb.checked; fallo(err); }
    finally { cb.disabled = false; }
  });
  await cargar();
}

function modoAuth(on) { document.body.classList.toggle('auth-mode', on); }

function paginaConexion(mensaje = '') {
  modoAuth(!auth.session);
  view.innerHTML = `<div class="setup">
    <div><h1>Conecta LoteSmart con Supabase</h1><p class="muted" style="margin:6px 0 0">Solo se hace una vez en este navegador.</p></div>
    ${mensaje ? `<div class="notice bad">${esc(mensaje)}</div>` : ''}
    <div class="card card-pad" style="display:flex;flex-direction:column;gap:14px">
      <ol class="steps">
        <li>En Supabase abre <b>SQL Editor</b>, pega el archivo <code>lotesmart_supabase.sql</code> y pulsa <b>Run</b>.</li>
        <li>Ve a <b>Project Settings → API</b> y copia la <b>Project URL</b> y la clave <b>publishable</b> (o <b>anon public</b>).</li>
        <li>Pégalas aquí y pulsa <b>Conectar</b>. Después inicia sesión o crea tu cuenta.</li>
      </ol>
      <div class="field"><label for="cUrl">Project URL</label><input class="input mono" id="cUrl" placeholder="https://abcdefgh.supabase.co" value="${esc(cfg.url)}" autocomplete="off"></div>
      <div class="field"><label for="cKey">Clave publishable (o anon public)</label><textarea class="input mono" id="cKey" rows="3" placeholder="sb_publishable_… o eyJhbGciOi…" style="min-height:80px">${esc(cfg.key)}</textarea></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">${auth.session ? `<button class="btn" type="button" id="cBack">Volver</button>` : ''}<button class="btn primary" type="button" id="cGo">${icon('plug')}Conectar</button></div>
    </div></div>`;
  if ($('#cBack')) $('#cBack').addEventListener('click', () => router());
  $('#cGo').addEventListener('click', async () => {
    const url = $('#cUrl').value.trim().replace(/\/+$/, ''), key = $('#cKey').value.trim();
    if (!/^https?:\/\/.+/.test(url)) return toast('Escribe la URL completa del proyecto, empieza con https://', true);
    if (key.length < 20) return toast('Pega la anon key completa.', true);
    const antes = cfg.url;
    Object.assign(cfg, { url, key });
    try {
      await auth.llamar('settings');
      store.set('url', url); store.set('key', key);
      if (antes !== url) auth.limpiar();
      setConn(true); toast('Conexión lista.'); router();
    } catch (e) { setConn(false); paginaConexion(e.message); }
  });
}

          ${modo === 'crear' ? '<span class="help">Mínimo 6 caracteres.</span>' : ''}<span class="err"></span></div>` : ''}

      </form>
      <div class="login-links">
        ${modo === 'entrar' ? '<button type="button" class="link" data-modo="recuperar">¿Olvidaste tu contraseña?</button>' : '<button type="button" class="link" data-modo="entrar">Volver a iniciar sesión</button>'}
        ${modo === 'entrar' ? '<span class="muted" style="font-size:.84rem">¿No tienes cuenta? Pide a un administrador que te dé de alta.</span>' : ''}
        ${CONFIG.url ? '' : '<button type="button" class="link" id="lConn">Cambiar conexión</button>'}

  $$('[data-modo]').forEach((b) => b.addEventListener('click', () => paginaLogin('', b.dataset.modo)));

  setTimeout(() => { if ($('.login') && $('.login').contains(document.activeElement)) return; const f = modo === 'crear' ? $('#lNombre') : (correo && $('#lPass')) || $('#lEmail'); f && f.focus(); }, 30);

    } catch (err) { paginaLogin(err.message, modo); if ($('#lEmail')) $('#lEmail').value = email; }
  });
}

/* Supabase regresa aquí con #access_token=… al confirmar el correo o al recuperar la contraseña. */
async function leerRetornoAuth() {
  if (!location.hash.includes('access_token=')) return false;
  const h = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const user = await auth.llamar('user', undefined, h.get('access_token'));
    auth.guardar({ access_token: h.get('access_token'), refresh_token: h.get('refresh_token'), expires_in: Number(h.get('expires_in') || 3600), user });
    if (h.get('type') === 'recovery') setTimeout(cambiarContrasena, 300);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}
function cambiarContrasena() {
  formModal({ title: 'Nueva contraseña', okLabel: 'Guardar contraseña',
    fields: [{ name: 'p1', label: 'Nueva contraseña', type: 'password', required: true, minLen: 6, full: true }, { name: 'p2', label: 'Repite la contraseña', type: 'password', required: true, full: true }],
    onSubmit: async (d) => {
      if (d.p1 !== d.p2) throw new ApiError('Las contraseñas no coinciden.');
      let res = await fetch(cfg.url + '/auth/v1/user', { method: 'PUT', headers: { apikey: cfg.key, Authorization: 'Bearer ' + auth.session.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify({ password: d.p1 }) });
      if (!res.ok) throw new ApiError('No se pudo cambiar la contraseña. Usa al menos 6 caracteres.');
      toast('Contraseña actualizada.');
    } });
}

/* Mi cuenta: nombre con el que se firma y cambio de contraseña. */
function miCuenta() {
  formModal({ title: 'Mi cuenta', okLabel: 'Guardar',
    fields: [
      { name: 'nombre', label: 'Nombre (así firmas ventas, mermas y cambios)', required: true, minLen: 3, max: 80, full: true },
      { name: 'email', label: 'Correo', disabled: true, full: true },
      { name: 'p1', label: 'Nueva contraseña (déjala vacía para no cambiarla)', type: 'password', full: true, minLen: 6 },
      { name: 'p2', label: 'Repite la nueva contraseña', type: 'password', full: true }
    ],
    notice: auth.perfil ? `Tu rol: <b>${esc(auth.perfil.rol_nombre)}</b>. Solo un administrador puede cambiarlo.` : '',
    values: { nombre: auth.nombre, email: auth.user ? auth.user.email : '' },
    onSubmit: async (d) => {
      if ((d.p1 || d.p2) && d.p1 !== d.p2) throw new ApiError('Las contraseñas no coinciden.');
      await db.rpc('mi_nombre', { p_nombre: d.nombre });
      const body = { data: { nombre: d.nombre } };
      if (d.p1) body.password = d.p1;
      const res = await fetch(cfg.url.replace(/\/+$/, '') + '/auth/v1/user', { method: 'PUT',
        headers: { apikey: cfg.key, Authorization: 'Bearer ' + auth.session.access_token, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!res.ok) throw new ApiError(d.p1 ? 'No se pudo guardar. La contraseña debe tener al menos 6 caracteres y ser distinta a la actual.' : 'No se pudo guardar el nombre.');
      await auth.renovar();          // nuevo token con el nombre actualizado
      await cargarPerfil();
      pintaPie();
      toast(d.p1 ? 'Nombre y contraseña actualizados.' : 'Nombre actualizado.');
    } });
}

async function entrarApp() {
  try { await cargarPerfil(); } catch (e) { return router(e.message); }
  modoAuth(false);
  pintaPie();
  toast(`Hola, ${auth.nombre}.`);
  if (auth.perfil.rol === 'CONSULTA') toast('Tu rol es Consulta: puedes ver y generar reportes, pero no registrar. Pide más permisos a un administrador.');
  if (!location.hash || location.hash === '#') history.replaceState(null, '', '#' + inicio()[0]);
  router();
}
async function cerrarSesion() {
  if (!await confirmar({ title: 'Cerrar sesión', message: `Saldrás de LoteSmart en este navegador. Para volver a entrar necesitarás tu correo y contraseña.`, okLabel: 'Cerrar sesión' })) return;
  await auth.salir();
  carrito = [];
  router('Cerraste sesión.');
}
function pintaPie() {
  const ini = (auth.nombre || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
  $('#btnUser').innerHTML = `<span class="avatar">${esc(ini)}</span><span class="who"><b>${esc(auth.nombre || 'Sin sesión')}</b><small>${esc(auth.perfil ? auth.perfil.rol_nombre : (auth.user ? auth.user.email : ''))}</small></span>`;
  $('#btnUser').title = 'Mi cuenta: nombre y contraseña';
  $('#btnLogout').innerHTML = icon('logout').replace('<svg', '<svg width="16" height="16"') + '<span>Cerrar sesión</span>';
}

/* =====================================================================
   NAVEGACIÓN
   ===================================================================== */
const view = $('#view');
const RUTAS = [
  ['Operación'],
  ['tablero', 'Tablero', 'dash', paginaTablero, 'tablero.ver'],
  ['ventas', 'Ventas', 'cart', paginaVentas],
  ['lotes', 'Lotes', 'box', paginaLotes],
  ['Catálogos'],
  ['productos', 'Productos', 'tag', () => paginaCatalogo('productos')],
  ['proveedores', 'Proveedores', 'truck', () => paginaCatalogo('proveedores')],
  ['clientes', 'Clientes', 'users', () => paginaCatalogo('clientes')],
  ['Análisis y control'],
  ['reportes', 'Reportes', 'chart', paginaReportes],
  ['trazabilidad', 'Trazabilidad', 'route', paginaTrazabilidad],
  ['auditoria', 'Auditoría', 'log', paginaAuditoria, 'auditoria.ver'],
  ['usuarios', 'Usuarios y permisos', 'users', paginaUsuarios, 'usuarios.administrar']
];
RUTAS.find((r) => r[0] === 'reportes').push('reportes.ver');
const rutaVisible = (r) => r.length > 1 && (!r[4] || puede(r[4]));
const inicio = () => RUTAS.find(rutaVisible) || RUTAS[2];   // primera pantalla permitida para el rol
// Pasa a CADUCADO los lotes vencidos una vez por sesión (o al abrir el tablero), para cualquier rol.
let ultimaRevision = 0;
async function revisarCaducados(forzar = false) {
  if (!forzar && Date.now() - ultimaRevision < 10 * 60 * 1000) return;
  ultimaRevision = Date.now();
  try { const n = await db.rpc('marcar_caducados'); if (n > 0) toast(`${n} ${n === 1 ? 'lote pasó' : 'lotes pasaron'} a CADUCADO.`); } catch {}
}
function pintaNav() {
  const html = [];
  for (let i = 0; i < RUTAS.length; i++) {
    const r = RUTAS[i];
    if (r.length === 1) {
      let j = i + 1, alguna = false;
      for (; j < RUTAS.length && RUTAS[j].length > 1; j++) if (rutaVisible(RUTAS[j])) alguna = true;
      if (alguna) html.push(`<div class="group">${r[0]}</div>`);
    } else if (rutaVisible(r)) {
      html.push(`<a href="#${r[0]}" data-ruta="${r[0]}">${icon(r[2]).replace('<svg', '<svg width="18" height="18"')}<span>${r[1]}</span></a>`);
    }
  }
  $('#nav').innerHTML = html.join('');
}

async function router(mensaje) {
  document.body.classList.remove('menu-open');
  while (modalStack.length) closeModal();
  tip.hidden = true;
  if (!cfg.url || !cfg.key) return paginaConexion();
  if (!auth.session) return paginaLogin(typeof mensaje === 'string' ? mensaje : '');
  if (!auth.perfil) {
    try { await cargarPerfil(); }
    catch (e) { if (!auth.session) return paginaLogin(e.message); fallo(e); return; }
  }
  modoAuth(false);
  pintaNav(); pintaPie();
  revisarCaducados();
  const nombre = (location.hash || '#' + inicio()[0]).slice(1);
  let r = RUTAS.find((x) => x[0] === nombre && x.length > 1) || inicio();
  if (!rutaVisible(r)) {
    if (location.hash) toast(`Tu rol no tiene acceso a ${r[1]}.`, true);
    r = inicio(); history.replaceState(null, '', '#' + r[0]);
  }
  $$('#nav a').forEach((a) => { if (a.dataset.ruta === r[0]) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.title = r[1] + ' · LoteSmart';
  window.scrollTo(0, 0);
  try { await r[3](); } catch (e) { if (!(e instanceof SesionExpirada)) fallo(e); }
}
window.addEventListener('hashchange', () => { if (!location.hash.includes('access_token=')) router(); });
$('#btnMenu').innerHTML = icon('menu').replace('<svg', '<svg width="18" height="18"');
$('#btnMenu').addEventListener('click', () => document.body.classList.toggle('menu-open'));
$('#scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
$('#btnUser').addEventListener('click', miCuenta);
$('#btnLogout').addEventListener('click', cerrarSesion);
pintaPie();
leerRetornoAuth().then(() => { pintaPie(); router(); });
</script>
</body>
</html>
