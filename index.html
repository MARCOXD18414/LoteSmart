<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LoteSmart</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo; cada módulo = filtros arriba, listado abajo, detalle y formularios en ventana modal. */
:root {
  --bg: #EEF3F1; --surface: #FFFFFF; --surface-2: #F6F9F8; --ink: #13302A; --muted: #587069; --line: #D7E2DE;
  --accent: #0B8468; --accent-strong: #08664F; --accent-soft: #DCF1EA; --on-accent: #FFFFFF;
  --side: #10342C; --side-ink: #D5E7E1; --side-muted: #88A9A0; --side-active: #1B4A3F;
  --red: #C23A26; --red-soft: #FBE3DE; --amber: #A86F00; --amber-soft: #FBEFD2; --green: #1E7B45; --green-soft: #DDF2E4;
  --violet: #6A4CC0; --violet-soft: #ECE6FA; --gray: #66726F; --gray-soft: #E7ECEA;
  --shadow: 0 1px 2px rgba(16,52,44,.06), 0 6px 20px rgba(16,52,44,.07);
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1714; --surface: #14211D; --surface-2: #192A25; --ink: #E2EEEA; --muted: #92A9A2; --line: #26392F;
  --accent: #2DBF98; --accent-strong: #5AD5B3; --accent-soft: #143B31; --on-accent: #06231B;
  --side: #0A1311; --side-ink: #CFE3DC; --side-muted: #7C988F; --side-active: #17342C;
  --red: #FF7F6B; --red-soft: #3D1E19; --amber: #F0B74A; --amber-soft: #3A2D12; --green: #5FD08E; --green-soft: #15331F;
  --violet: #B19CF5; --violet-soft: #2A2245; --gray: #A3B0AC; --gray-soft: #24302C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1714; --surface: #14211D; --surface-2: #192A25; --ink: #E2EEEA; --muted: #92A9A2; --line: #26392F;
  --accent: #2DBF98; --accent-strong: #5AD5B3; --accent-soft: #143B31; --on-accent: #06231B;
  --side: #0A1311; --side-ink: #CFE3DC; --side-muted: #7C988F; --side-active: #17342C;
  --red: #FF7F6B; --red-soft: #3D1E19; --amber: #F0B74A; --amber-soft: #3A2D12; --green: #5FD08E; --green-soft: #15331F;
  --violet: #B19CF5; --violet-soft: #2A2245; --gray: #A3B0AC; --gray-soft: #24302C;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); margin: 0 }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.2 }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em }
h2 { font-size: 1.12rem; font-weight: 600 }
h3 { font-size: .95rem; font-weight: 600 }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: .01em }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
.muted { color: var(--muted) }
.nw { white-space: nowrap }
td .mono, td.mono { white-space: nowrap }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }

/* ---------- Estructura ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100% }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; gap: 4px;
  padding: 20px 12px; position: sticky; top: 0; height: 100vh; height: 100dvh }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent) }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1.1 }
.brand small { color: var(--side-muted); font-size: .72rem }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--side-ink);
  text-decoration: none; font-weight: 500 }
.nav a:hover { background: var(--side-active) }
.nav a[aria-current="page"] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--accent) }
.nav .group { font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--side-muted); padding: 14px 10px 4px }
.side-foot { margin-top: auto; border-top: 1px solid var(--side-active); padding: 12px 10px 0; display: flex; flex-direction: column; gap: 8px; font-size: .8rem }
.side-foot button { background: transparent; border: 1px solid var(--side-active); color: var(--side-ink); border-radius: 8px; padding: 7px 10px; cursor: pointer; text-align: left; display: flex; gap: 8px; align-items: center }
.side-foot button:hover { background: var(--side-active) }
.conn { display: flex; align-items: center; gap: 6px; color: var(--side-muted) }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--side-muted) }
.dot.ok { background: #3ED39C } .dot.bad { background: #FF7F6B }

.main { min-width: 0; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
.topbar { display: none }
.scrim { display: none }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch }

/* ---------- Componentes ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow) }
.card-pad { padding: 16px }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); padding: 8px 13px; font-weight: 500; cursor: pointer; white-space: nowrap; line-height: 1.2 }
.btn:hover { border-color: var(--accent); color: var(--accent-strong) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent) }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)) }
.btn.danger:hover { background: var(--red-soft) }
.btn.danger-solid { background: var(--red); border-color: var(--red); color: #fff }
.btn.ghost { border-color: transparent; background: transparent }
.btn.sm { padding: 5px 9px; font-size: .82rem; border-radius: 7px }
.btn[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none }
.btn svg { width: 15px; height: 15px; flex: none }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.search { position: relative; flex: 1 1 240px; max-width: 380px }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted) }
.search input { padding-left: 34px }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 38px }
textarea.input { min-height: 72px; resize: vertical }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
.input[disabled] { background: var(--surface-2); color: var(--muted) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 500; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-strong) }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: .82rem; font-weight: 500; color: var(--muted) }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong) }

.table-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
tr:last-child td { border-bottom: 0 }
tbody tr.click { cursor: pointer }
tbody tr.click:hover td { background: var(--surface-2) }
tr.off td { color: var(--muted) }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap }
.empty { padding: 36px 16px; text-align: center; color: var(--muted) }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1rem; margin-bottom: 4px }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: .74rem; font-weight: 600; white-space: nowrap; letter-spacing: .02em }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor }
.s-ROJO, .s-CANCELADA, .s-BAJA { color: var(--red); background: var(--red-soft) }
.s-AMARILLO { color: var(--amber); background: var(--amber-soft) }
.s-VERDE, .s-REGISTRADA, .s-ACTIVO { color: var(--green); background: var(--green-soft) }
.s-CADUCADO { color: var(--red); background: var(--red-soft); border: 1px dashed var(--red) }
.s-AGOTADO { color: var(--gray); background: var(--gray-soft) }
.s-BLOQUEADO { color: var(--violet); background: var(--violet-soft) }
.thumb { border-radius: 8px; object-fit: cover; display: inline-grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); vertical-align: middle; flex: none }
.thumb.ph { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; font-size: .72rem; letter-spacing: .02em }
.prod-cell { display: flex; align-items: center; gap: 10px }
.img-field { display: flex; gap: 14px; align-items: center; flex-wrap: wrap }
.img-prev { width: 96px; height: 96px; border-radius: 10px; border: 1px dashed var(--line); background: var(--surface-2); display: grid; place-items: center; overflow: hidden; flex: none; font-size: .8rem }
.img-prev img { width: 100%; height: 100%; object-fit: cover }
.img-ctl { display: flex; flex-direction: column; gap: 6px; align-items: flex-start }
.detalle-top { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap }
.foto-grande { width: 160px; height: 160px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; flex: none }
.foto-grande img { width: 100%; height: 100%; object-fit: cover }
.foto-grande .thumb { border: 0 }
.matriz td.center, .matriz th.center { text-align: center }
.matriz input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer }
.kvs { display: flex; flex-wrap: wrap; gap: 4px 6px }
.kv { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: .78rem; white-space: nowrap }
.tag { display: inline-block; font-size: .7rem; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--amber-soft); color: var(--amber); margin-left: 6px; vertical-align: middle }

/* Etiqueta de lote: como la etiqueta impresa en la caja */
.lot { display: inline-flex; flex-direction: column; border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: 4px; padding: 3px 8px 2px; background: var(--surface-2); line-height: 1.2 }
.lot b { font-family: var(--f-mono); font-size: .84rem; font-weight: 600; white-space: nowrap }
.lot small { font-family: var(--f-mono); font-size: .68rem; color: var(--muted); letter-spacing: .03em }

/* Tablero */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px }
.kpi { padding: 16px; display: flex; flex-direction: column; gap: 4px }
.kpi .v { font-family: var(--f-display); font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15 }
.kpi .d { font-size: .8rem; color: var(--muted) }
.kpi.alert { border-color: color-mix(in srgb, var(--red) 45%, var(--line)) }
.kpi.alert .v { color: var(--red) }
.semaforo-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--gray-soft); gap: 2px }
.semaforo-bar span { display: block; min-width: 4px }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .82rem }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start }
.grid-sale { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start }

/* Formularios */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field.full { grid-column: 1 / -1 }
.field label { font-weight: 500; font-size: .86rem }
.field label .req { color: var(--red) }
.field .help { font-size: .76rem; color: var(--muted) }
.field .err { font-size: .78rem; color: var(--red); display: none }
.field.invalid .input { border-color: var(--red) }
.field.invalid .err { display: block }
.radio-row { display: flex; gap: 8px; flex-wrap: wrap }
.radio-row label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-weight: 500 }
.radio-row input:checked + span { color: var(--accent-strong) }

/* Modal */
.overlay { position: fixed; inset: 0; background: rgba(8,24,20,.48); display: grid; place-items: center; z-index: 50;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--surface); border-radius: 14px; width: min(720px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.3); border: 1px solid var(--line) }
.modal.sm { width: min(460px, 100%) }
.modal.lg { width: min(940px, 100%) }
.modal-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px }
.modal-body { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 16px }
.modal-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.modal-foot .spacer { flex: 1 }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 18px; margin: 0 }
.facts div { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.facts dt { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600 }
.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere }
.notice { border-radius: 8px; padding: 10px 12px; background: var(--accent-soft); color: var(--accent-strong); font-size: .86rem }
.notice.warn { background: var(--amber-soft); color: var(--amber) }
.notice.bad { background: var(--red-soft); color: var(--red) }

/* FEFO */
.fefo { display: flex; flex-direction: column; gap: 12px }
.fefo-item { border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.fefo-item header { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--surface-2); font-weight: 600; flex-wrap: wrap }
.fefo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line) }
.fefo-row .lot { justify-self: start }
.fefo-row .take { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--accent-strong) }
.total-row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; border-top: 1px solid var(--line); font-weight: 600 }
.total-row .v { font-family: var(--f-display); font-size: 1.35rem }

/* Toast */
.toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(420px, calc(100% - 32px)) }
.toast { background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 9px; box-shadow: var(--shadow); font-weight: 500; display: flex; gap: 10px; align-items: flex-start }
.toast.bad { background: var(--red); color: #fff }
.loading { padding: 28px; text-align: center; color: var(--muted) }
.skeleton { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite }
@keyframes sk { to { background-position: -200% 0 } }

/* Config */
.setup { max-width: 620px; margin: 6vh auto 0; display: flex; flex-direction: column; gap: 16px }
.steps { margin: 0; padding-left: 20px; color: var(--muted); display: flex; flex-direction: column; gap: 4px }
.steps code, .notice code { font-family: var(--f-mono); font-size: .82em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--ink) }


/* Sesión */
body.auth-mode .app { grid-template-columns: minmax(0, 1fr) }
body.auth-mode .side, body.auth-mode .topbar, body.auth-mode .scrim { display: none !important }
.login { min-height: calc(100vh - 72px); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; max-width: 1040px; margin: 0 auto; width: 100%;
  border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line) }
.login-brand { background: var(--side); color: var(--side-ink); padding: 36px; display: flex; flex-direction: column; gap: 28px; justify-content: space-between }
.login-brand .brand { padding: 0 }
.login-pitch h2 { font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: -.015em; max-width: 14ch }
.login-pitch p { color: var(--side-muted); max-width: 40ch; margin: 12px 0 0; font-size: .95rem }
.login-labels { display: grid; grid-template-columns: auto auto; gap: 10px 14px; justify-content: start; align-items: center }
.login-labels .lot { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); border-left-color: var(--accent) }
.login-labels .lot b { color: #fff } .login-labels .lot small { color: var(--side-muted) }
.login-form { border: 0; border-radius: 0; box-shadow: none; padding: 36px; display: flex; flex-direction: column; gap: 18px; justify-content: center }
.login-tabs { align-self: flex-start }
.login-links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent-strong); font-weight: 500; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }
.user-btn { align-items: center !important }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: .78rem; flex: none }
.who { display: flex; flex-direction: column; min-width: 0; line-height: 1.25 }
.who b { font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.who small { color: var(--side-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .72rem }

/* Reportes */
.rep-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.rep-opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; cursor: pointer; color: var(--ink) }
.rep-opt svg { width: 20px; height: 20px; flex: none; color: var(--accent); margin-top: 1px }
.rep-opt b { display: block; font-weight: 600; font-size: .9rem }
.rep-opt small { display: block; color: var(--muted); font-size: .76rem; line-height: 1.35; margin-top: 2px }
.rep-opt:hover { border-color: var(--accent) }
.rep-opt[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent) }
.rep-params { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end }
.rep-group { display: flex; flex-direction: column; gap: 8px }
.rep-dates { display: flex; gap: 10px; flex-wrap: wrap }
.rep-dates label { display: flex; align-items: center; gap: 6px }
.rep-dates .input { width: auto }

    if (limit) q.push('limit=' + limit);
    return req(view + '?' + q.join('&'));
  },
  one: async (view, col, val) => (await db.list(view, { where: [[col, 'eq', val]], limit: 1 }))[0],
  rpc(fn, args = {}) {
    return req('rpc/' + fn, { method: 'POST', body: JSON.stringify(args) });

let modalStack = [];
function openModal({ title, body = '', foot = '', size = '' }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button class="btn ghost sm" type="button" data-close aria-label="Cerrar">${icon('x')}</button></div>
    <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) closeModal(ov); });
  $$('[data-close]', ov).forEach((b) => b.addEventListener('click', () => closeModal(ov)));
  document.body.append(ov);
  modalStack.push(ov);
  setTimeout(() => { if (ov.contains(document.activeElement)) return; const f = $('input:not([disabled]),select:not([disabled]),textarea', ov); (f || $('[data-close]', ov)).focus(); }, 20);
  return ov;
}
function closeModal(ov = modalStack[modalStack.length - 1]) {
  if (!ov) return;
  ov.remove();
  modalStack = modalStack.filter((m) => m !== ov);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* Confirmación dentro de la página (el visor no admite confirm()). */
function confirmar({ title, message, okLabel = 'Confirmar', danger = false, reason = null }) {
  return new Promise((resolve) => {
    const ov = openModal({
      title, size: 'sm',
      body: `<p style="margin:0">${message}</p>${reason ? `<div class="field" id="f_reason"><label for="i_reason">${esc(reason)} <span class="req">*</span></label>
        <textarea class="input" id="i_reason" maxlength="200"></textarea><span class="err">Escribe el motivo.</span></div>` : ''}`,
      foot: `<button class="btn" type="button" data-close>Volver</button><button class="btn ${danger ? 'danger-solid' : 'primary'}" type="button" id="okBtn">${esc(okLabel)}</button>`
    });
    let done = false;
    const fin = (v) => { if (!done) { done = true; resolve(v); } };
    $('#okBtn', ov).addEventListener('click', () => {
      if (reason) {
        const v = $('#i_reason', ov).value.trim();
        if (!v) { $('#f_reason', ov).classList.add('invalid'); return; }
        closeModal(ov); fin(v);
      } else { closeModal(ov); fin(true); }
    });
    new MutationObserver((_, obs) => { if (!document.body.contains(ov)) { obs.disconnect(); fin(null); } }).observe(document.body, { childList: true });
  });
}

async function fieldsHtml(fields, values = {}) {
  const parts = [];
  for (const f of fields) {
    const id = 'f_' + f.name, v = values[f.name] ?? f.value ?? '';
    const dis = f.disabled ? ' disabled' : '';
    const req = f.required ? ' <span class="req">*</span>' : '';
    let ctl;
    if (f.type === 'select') {
      const opts = typeof f.options === 'function' ? await f.options(values) : f.options;
      ctl = `<select class="input" id="${id}" name="${f.name}"${dis}><option value="">Selecciona…</option>${opts.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v) ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select>`;
    } else if (f.type === 'textarea') {
      ctl = `<textarea class="input" id="${id}" name="${f.name}" maxlength="${f.max || 200}"${dis}>${esc(v)}</textarea>`;
    } else if (f.type === 'image') {
      ctl = `<div class="img-field" id="${id}">
        <div class="img-prev">${v ? `<img src="${esc(imgUrl(v))}" alt="Foto actual">` : '<span class="muted">Sin foto</span>'}</div>
        <div class="img-ctl">
          <label class="btn sm">${icon('plus')}<span>${v ? 'Cambiar foto' : 'Elegir foto'}</span><input type="file" accept="image/jpeg,image/png,image/webp" data-img-input hidden></label>
          <button type="button" class="btn sm ghost" data-img-quitar${v ? '' : ' hidden'}>Quitar foto</button>
          <span class="img-name help">${v ? 'Foto actual' : 'JPG, PNG o WebP. Se ajusta sola a 800 px.'}</span>
        </div></div>`;
    } else if (f.type === 'radio') {
      ctl = `<div class="radio-row">${f.options.map(([ov, ol]) => `<label><input type="radio" name="${f.name}" value="${esc(ov)}"${String(ov) === String(v) ? ' checked' : ''}><span>${esc(ol)}</span></label>`).join('')}</div>`;
    } else {
      const t = f.type === 'money' || f.type === 'int' ? 'number' : (f.type || 'text');
      const step = f.type === 'money' ? ' step="0.01"' : f.type === 'int' ? ' step="1"' : '';
      const min = f.min != null ? ` min="${f.min}"` : '';
      const max = f.maxNum != null ? ` max="${f.maxNum}"` : '';
      const ml = f.max ? ` maxlength="${f.max}"` : '';
      const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '';
      const im = f.type === 'money' ? ' inputmode="decimal"' : f.type === 'int' ? ' inputmode="numeric"' : '';
      ctl = `<input class="input${f.mono ? ' mono' : ''}" id="${id}" name="${f.name}" type="${t}" value="${esc(v)}"${step}${min}${max}${ml}${ph}${im}${dis} autocomplete="off">`;
    }
    parts.push(`<div class="field${f.full ? ' full' : ''}" data-field="${f.name}"><label for="${id}">${esc(f.label)}${req}</label>${ctl}
      ${f.help ? `<span class="help">${f.help}</span>` : ''}<span class="err"></span></div>`);
  }
  return `<form class="form" novalidate>${parts.join('')}</form>`;
}
function readForm(root, fields) {
  const out = {}; let ok = true;
  for (const f of fields) {
    const wrap = $(`[data-field="${f.name}"]`, root);
    let raw;
    if (f.type === 'image') { const w = $('.img-field', wrap); out[f.name] = { file: w._file || null, quitar: !!w._quitar, actual: f.actual || null }; continue; }
    if (f.type === 'radio') raw = ($(`input[name="${f.name}"]:checked`, root) || {}).value || '';
    else raw = $(`[name="${f.name}"]`, root).value.trim();
    let err = '';
    if (f.upper) raw = raw.toUpperCase();
    if (f.disabled) { out[f.name] = raw === '' ? null : (f.type === 'int' ? parseInt(raw, 10) : f.type === 'money' ? Number(raw) : raw); continue; }
    if (f.required && raw === '') err = 'Este campo es obligatorio.';
    else if (raw !== '') {
      if (f.type === 'int' && !/^-?\d+$/.test(raw)) err = 'Escribe un número entero.';
      else if (f.type === 'money' && isNaN(Number(raw))) err = 'Escribe una cantidad válida.';
      else if ((f.type === 'int' || f.type === 'money') && f.min != null && Number(raw) < f.min) err = `Debe ser mayor o igual a ${f.min}.`;
      else if ((f.type === 'int' || f.type === 'money') && f.gt0 && Number(raw) <= 0) err = 'Debe ser mayor que 0.';
      else if ((f.type === 'int') && f.maxNum != null && Number(raw) > f.maxNum) err = `No puede ser mayor que ${f.maxNum}.`;
      else if (f.minLen && raw.length < f.minLen) err = `Escribe al menos ${f.minLen} caracteres.`;
      else if (f.pattern && !f.pattern.test(raw)) err = f.patternMsg || 'Formato no válido.';
      else if (f.check) err = f.check(raw) || '';
    }
    wrap.classList.toggle('invalid', !!err);
    $('.err', wrap).textContent = err;
    if (err) ok = false;
    out[f.name] = raw === '' ? null : (f.type === 'int' ? parseInt(raw, 10) : f.type === 'money' ? Number(raw) : raw);
  }
  if (!ok) { const first = $('.field.invalid .input, .field.invalid input', root); first && first.focus(); }
  return ok ? out : null;
}
async function formModal({ title, fields, values = {}, okLabel = 'Guardar', notice = '', onSubmit }) {
  const ov = openModal({
    title,
    body: (notice ? `<div class="notice warn">${notice}</div>` : '') + await fieldsHtml(fields, values),
    foot: `<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="button" id="saveBtn">${icon('check')}${esc(okLabel)}</button>`
  });
  const go = async () => {
    const data = readForm(ov, fields);
    if (!data) return;
    const btn = $('#saveBtn', ov); btn.disabled = true;
    try { await onSubmit(data); closeModal(ov); }
    catch (e) { fallo(e); }
    finally { btn.disabled = false; }
  };
  $('#saveBtn', ov).addEventListener('click', go);
  $('form', ov).addEventListener('submit', (e) => { e.preventDefault(); go(); });
  $('form', ov).addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); } });
  return ov;
}

const imgUrl = (path) => path ? cfg.url.replace(/\/+$/, '') + '/storage/v1/object/public/productos/' + path.split('/').map(encodeURIComponent).join('/') : '';
const iniciales = (t) => String(t || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();
const thumb = (path, nombre, size = 40) => path
  ? `<img class="thumb" src="${esc(imgUrl(path))}" alt="${esc(nombre)}" width="${size}" height="${size}" loading="lazy" style="width:${size}px;height:${size}px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'thumb ph',textContent:'${esc(iniciales(nombre)).replace(/'/g, '')}',style:'width:${size}px;height:${size}px'}))">`
  : `<span class="thumb ph" style="width:${size}px;height:${size}px" aria-hidden="true">${esc(iniciales(nombre))}</span>`;
async function reducirImagen(file, max = 800) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new ApiError('La foto debe ser JPG, PNG o WebP.');
  if (file.size > 15 * 1024 * 1024) throw new ApiError('La foto pesa más de 15 MB. Elige una más ligera.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new ApiError('No se pudo leer la imagen.')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    let blob = await new Promise((ok) => c.toBlob(ok, 'image/webp', 0.85));
    if (!blob || blob.type !== 'image/webp') blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85));
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
async function subirFoto(file, idProducto) {
  const blob = await reducirImagen(file);
  if (auth.session.expires_at - Date.now() / 1000 < 60) await auth.renovar();
  const path = `p${idProducto}-${Date.now()}.${blob.type === 'image/webp' ? 'webp' : 'jpg'}`;
  let res;
  try {
    res = await fetch(cfg.url.replace(/\/+$/, '') + '/storage/v1/object/productos/' + path, {
      method: 'POST', body: blob,
      headers: { apikey: cfg.key, Authorization: 'Bearer ' + auth.session.access_token, 'Content-Type': blob.type, 'x-upsert': 'true', 'cache-control': '31536000' }
    });
  } catch { throw new ApiError('No se pudo subir la foto. Revisa tu conexión.'); }
  if (!res.ok) {
    const t = await res.text();
    if (/bucket not found/i.test(t)) throw new ApiError('Falta el espacio para fotos en Supabase. Ejecuta sql/actualizacion_02_imagenes.sql.');
    if (/row-level security|unauthorized|403/i.test(t) || res.status === 403) throw new ApiError('Sin permiso para subir fotos. Ejecuta sql/actualizacion_02_imagenes.sql en Supabase.');
    if (res.status === 413 || /too large|exceeded/i.test(t)) throw new ApiError('La foto es demasiado pesada (máximo 2 MB).');
    throw new ApiError('No se pudo subir la foto (' + res.status + ').');
  }
  return path;
}
function borrarFoto(path) {
  if (!path || !auth.session) return;
  fetch(cfg.url.replace(/\/+$/, '') + '/storage/v1/object/productos/' + path, { method: 'DELETE', headers: { apikey: cfg.key, Authorization: 'Bearer ' + auth.session.access_token } }).catch(() => {});
}

function tablaLotesMini(lotes) {
  if (!lotes.length) return '<p class="muted" style="margin:0">Sin lotes registrados.</p>';
  return `<div class="table-wrap card"><table><thead><tr><th>Lote</th><th>Producto</th><th class="num">Existencia</th><th class="num">Días</th><th>Estado</th></tr></thead><tbody>
    ${lotes.map((l) => `<tr><td>${lotLabel(l.codigo_lote, l.fecha_caducidad)}</td><td>${esc(l.producto)}</td><td class="num">${int(l.cantidad_disponible)} / ${int(l.cantidad_inicial)}</td>
    <td class="num">${dias(l.dias_restantes)}</td><td>${pill(l.semaforo)}</td></tr>`).join('')}</tbody></table></div>`;
}

async function paginaCatalogo(key) {
  const C = CATALOGOS[key];
  const st = store.get('filtro.' + key, { texto: '', estado: 'activos' });
  view.innerHTML = `
    <div class="page-head"><div><h1>${C.titulo}</h1><p>${C.desc}</p></div>
      ${puede(C.perm) ? `<button class="btn primary" type="button" id="btnNuevo">${icon('plus')}Nuevo ${C.singular}</button>` : ''}</div>
    <div class="card">
      <div class="card-head">
        <div class="toolbar" style="flex:1">
          <label class="search"><span class="sr" hidden>Consultar</span>${icon('search')}<input class="input" id="q" type="search" placeholder="${esc(C.placeholder)}" value="${esc(st.texto)}" aria-label="${esc(C.placeholder)}"></label>
          <div class="seg" role="group" aria-label="Filtrar por estado">
            ${[['activos', 'Activos'], ['baja', 'De baja'], ['todos', 'Todos']].map(([v, l]) => `<button type="button" data-estado="${v}" aria-pressed="${st.estado === v}">${l}</button>`).join('')}
          </div>
        </div>
        <span class="muted" id="cuenta"></span>
      </div>
      <div class="table-wrap"><table><thead><tr>${C.cols.map(([t, , cls]) => `<th class="${cls || ''}">${t}</th>`).join('')}<th class="num">Acciones</th></tr></thead>
        <tbody id="rows">${loadingRow(C.cols.length + 1)}</tbody></table></div>
    </div>`;
  let datos = [];
  const marca = view.firstElementChild, vivo = () => marca.isConnected;
  const cargar = async () => {
    const where = st.estado === 'activos' ? [['activo', 'eq', 'true']] : st.estado === 'baja' ? [['activo', 'eq', 'false']] : [];
    const t = limpia(st.texto);
    try {
      datos = await db.list(C.vista, { where, or: t ? C.buscar.map((c) => [c, 'ilike', `*${t}*`]) : null, order: C.orden });
    } catch (e) { if (vivo()) $('#rows').innerHTML = emptyRow(C.cols.length + 1, 'No se pudo cargar el listado', ' ' + e.message); return; }
    if (!vivo()) return;
    $('#cuenta').textContent = `${datos.length} ${datos.length === 1 ? 'registro' : 'registros'}`;
    $('#rows').innerHTML = datos.length ? datos.map((r) => `<tr class="click${r.activo ? '' : ' off'}" data-id="${r[C.pk]}">
        ${C.cols.map(([, fn, cls]) => `<td class="${cls || ''}">${fn(r)}</td>`).join('')}
        <td><div class="row-actions">
          ${puede(C.perm) ? btn('editar', 'Editar', 'edit') + (r.activo ? btn('baja', 'Baja', 'archive') : btn('reactivar', 'Reactivar', 'restore')) : ''}
          ${puede('registros.eliminar') ? btn('eliminar', 'Eliminar', 'trash', 'danger') : ''}
          ${!puede(C.perm) && !puede('registros.eliminar') ? btn('ver', 'Ver', 'search') : ''}
        </div></td></tr>`).join('')
      : emptyRow(C.cols.length + 1, t ? 'Sin resultados' : `No hay ${C.titulo.toLowerCase()} ${st.estado === 'baja' ? 'dados de baja' : 'todavía'}`, t ? ' Prueba con otra búsqueda o cambia el filtro.' : ` Usa “Nuevo ${C.singular}” para dar de alta el primero.`);
  };
  const guardaFiltro = () => store.set('filtro.' + key, st);
  $('#q').addEventListener('input', debounce((e) => { st.texto = e.target.value; guardaFiltro(); cargar(); }));
  $$('[data-estado]').forEach((b) => b.addEventListener('click', () => {
    st.estado = b.dataset.estado; guardaFiltro();
    $$('[data-estado]').forEach((x) => x.setAttribute('aria-pressed', x === b)); cargar();
  }));
  if ($('#btnNuevo')) $('#btnNuevo').addEventListener('click', () => altaOEdicion(C, null, cargar));
  $('#rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const r = datos.find((d) => String(d[C.pk]) === tr.dataset.id);
    const a = e.target.closest('[data-action]');
    accionCatalogo(C, a ? a.dataset.action : 'ver', r, cargar);
  });
  await cargar();
}

async function altaOEdicion(C, r, recargar) {
  await formModal({
    title: r ? `Modificar ${C.singular}` : `Alta de ${C.singular}`,
    fields: C.campos(r || {}), values: r || {},
    okLabel: r ? 'Guardar cambios' : `Dar de alta`,
    onSubmit: async (d) => { await C.guardar(r ? r[C.pk] : null, d); toast(r ? 'Cambios guardados.' : `${C.singular[0].toUpperCase() + C.singular.slice(1)} dado de alta.`); recargar(); }
  });
}

async function accionCatalogo(C, accion, r, recargar) {
  const nom = C.nombre(r);
  try {
    if (accion === 'ver') return verCatalogo(C, r, recargar);
    if (accion === 'editar') return altaOEdicion(C, r, recargar);
    if (accion === 'baja') {
      if (!await confirmar({ title: `Dar de baja ${C.singular}`, message: `<b>${esc(nom)}</b>. ${C.bajaTxt} Puedes reactivarlo cuando quieras.`, okLabel: 'Dar de baja' })) return;
      await db.rpc(C.rpcBaja, conUsuario({ p_id: r[C.pk] })); toast(`${nom} dado de baja.`);
    }
    if (accion === 'reactivar') { await db.rpc(C.rpcReactivar, conUsuario({ p_id: r[C.pk] })); toast(`${nom} reactivado.`); }
    if (accion === 'eliminar') {
      if (!await confirmar({ title: `Eliminar ${C.singular}`, message: `Se borrará <b>${esc(nom)}</b> de forma definitiva. Solo es posible si nunca tuvo movimientos; si tiene historial, usa la baja.`, okLabel: 'Eliminar definitivamente', danger: true })) return;
      await db.rpc(C.rpcEliminar, conUsuario({ p_id: r[C.pk] })); toast(`${nom} eliminado.`);
    }
    closeModal(); recargar();
  } catch (e) { fallo(e); }
}

async function verCatalogo(C, r, recargar) {
  const ov = openModal({
    title: C.nombre(r), size: 'lg',
    body: `<div class="detalle-top">${C.vista === 'v_producto' ? `<div class="foto-grande">${r.imagen_path ? `<img src="${esc(imgUrl(r.imagen_path))}" alt="${esc(r.nombre)}">` : thumb(null, r.nombre, 120)}</div>` : ''}
      <dl class="facts" style="flex:1">${C.hechos(r).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></div><div id="rel"><div class="skeleton"></div></div>`,
    foot: (puede(C.perm) || puede('registros.eliminar')) ? `${puede('registros.eliminar') ? btn('eliminar', 'Eliminar', 'trash', 'danger') : ''}<span class="spacer"></span>
      ${puede(C.perm) ? (r.activo ? btn('baja', 'Dar de baja', 'archive') : btn('reactivar', 'Reactivar', 'restore')) + btn('editar', 'Editar', 'edit', 'primary') : ''}` : ''
  });
  if ($('.modal-foot', ov)) $('.modal-foot', ov).addEventListener('click', (e) => {
    const a = e.target.closest('[data-action]'); if (!a) return;
    if (a.dataset.action === 'editar') { closeModal(ov); altaOEdicion(C, r, recargar); }
    else accionCatalogo(C, a.dataset.action, r, recargar);
  });
  try { $('#rel', ov).innerHTML = await C.relacion(r); } catch (e) { $('#rel', ov).innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
}

      <div class="card kpi"><span class="label">Inventario vigente</span><span class="v">${money(t.valor_vigente)}</span><span class="d">A costo de compra</span></div>
      <div class="card kpi"><span class="label">Ventas de hoy</span><span class="v">${money(t.ventas_hoy)}</span><span class="d">${pl(t.productos_reorden, 'producto', 'productos')} por reordenar</span></div>`;
    const seg = [['ROJO', t.lotes_rojo, 'var(--red)'], ['AMARILLO', t.lotes_amarillo, 'var(--amber)'], ['VERDE', t.lotes_verde, 'var(--green)'],
      ['CADUCADO', t.lotes_caducados, 'color-mix(in srgb, var(--red) 45%, var(--gray))'], ['BLOQUEADO', t.lotes_bloqueados, 'var(--violet)']];
    const tot = seg.reduce((a, s) => a + Number(s[1]), 0) || 1;
    $('#sem').innerHTML = `<div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2>Semáforo de lotes con existencia</h2><span class="muted">${int(tot)} lotes</span></div>
      <div class="semaforo-bar" role="img" aria-label="${seg.map((s) => `${ESTADO_TXT[s[0]]}: ${s[1]}`).join(', ')}">${seg.filter((s) => s[1] > 0).map((s) => `<span style="flex:${s[1]};background:${s[2]}" title="${ESTADO_TXT[s[0]]}: ${s[1]}"></span>`).join('')}</div>

      <td class="num">${int(l.cantidad_disponible)} <span class="muted">${esc(l.unidad)}</span></td><td class="num">${dias(l.dias_restantes)}</td><td>${pill(l.semaforo)}</td><td class="num hide-sm">${money(l.valor_existencia)}</td></tr>`).join('')

      : '<div class="empty"><b>Todo en orden</b>Ningún producto está debajo de su stock mínimo.</div>';
  } catch (e) { fallo(e); $('#kpis').innerHTML = `<div class="notice bad" style="grid-column:1/-1">${esc(e.message)}</div>`; }
}

const camposLote = (l = {}) => {
  const conMov = !!l.tiene_movimientos;
  const manana = new Date(Date.now() + 864e5).toISOString().slice(0, 10);
  const nota = conMov ? 'El lote ya tiene movimientos: corrige la existencia con un ajuste.' : '';
  return [
    { name: 'id_producto', label: 'Producto', type: 'select', required: true, options: () => opciones.productosActivos(l.id_producto), disabled: conMov, help: conMov ? nota : '', full: true },
    { name: 'id_proveedor', label: 'Proveedor', type: 'select', required: true, options: () => opciones.proveedoresActivos(l.id_proveedor), full: true },
    { name: 'codigo_lote', label: 'Código de lote', required: true, max: 30, upper: true, mono: true, placeholder: 'LG-2411-C', help: 'Como viene impreso en la caja.' },
    { name: 'fecha_caducidad', label: 'Fecha de caducidad', type: 'date', required: true, min: manana, check: (v) => v < manana ? 'La caducidad debe ser posterior a hoy.' : '' },
    { name: 'cantidad_inicial', label: 'Cantidad recibida', type: 'int', required: true, gt0: true, min: 1, disabled: conMov },
    { name: 'costo_unitario', label: 'Costo unitario (MXN)', type: 'money', required: true, gt0: true, min: 0, disabled: conMov }
  ];
};

async function altaLote(recargar) {
  await formModal({
    title: 'Entrada de mercancía (alta de lote)', fields: camposLote(), okLabel: 'Registrar lote',
    onSubmit: async (d) => {
      await db.rpc('lote_alta', conUsuario({ p_id_producto: Number(d.id_producto), p_id_proveedor: Number(d.id_proveedor), p_codigo_lote: d.codigo_lote,
        p_fecha_caducidad: d.fecha_caducidad, p_cantidad: d.cantidad_inicial, p_costo_unitario: d.costo_unitario }));
      toast(`Lote ${d.codigo_lote} registrado.`); recargar();
    }
  });
}
async function editarLote(l, recargar) {
  await formModal({
    title: `Modificar lote ${l.codigo_lote}`, fields: camposLote(l), values: l, okLabel: 'Guardar cambios',
    notice: l.tiene_movimientos ? 'Este lote ya tiene movimientos. Solo puedes corregir proveedor, código y caducidad.' : '',
    onSubmit: async (d) => {
      await db.rpc('lote_modificar', conUsuario({ p_id: l.id_lote, p_id_producto: Number(d.id_producto ?? l.id_producto), p_id_proveedor: Number(d.id_proveedor),
        p_codigo_lote: d.codigo_lote, p_fecha_caducidad: d.fecha_caducidad, p_cantidad: d.cantidad_inicial ?? l.cantidad_inicial, p_costo_unitario: d.costo_unitario ?? l.costo_unitario }));
      toast('Lote actualizado.'); recargar();
    }
  });
}
async function mermaLote(l, recargar) {

    title: `Registrar merma · ${l.codigo_lote}`, okLabel: 'Registrar merma',
    notice: `Disponible: <b>${int(l.cantidad_disponible)} ${esc(l.unidad)}</b>. La merma descuenta producto dañado, caducado o perdido.`,
    fields: [
      { name: 'cantidad', label: 'Cantidad', type: 'int', required: true, gt0: true, min: 1, maxNum: l.cantidad_disponible },
      { name: 'motivo', label: 'Motivo', type: 'textarea', required: true, full: true, placeholder: 'Latas golpeadas, producto caducado…' }
    ],
    onSubmit: async (d) => { await db.rpc('registrar_merma', conUsuario({ p_id_lote: l.id_lote, p_cantidad: d.cantidad, p_motivo: d.motivo })); toast('Merma registrada.'); recargar(); }
  });
}
async function ajusteLote(l, recargar) {
  await formModal({
    title: `Ajuste de inventario · ${l.codigo_lote}`, okLabel: 'Registrar ajuste',
    notice: `Existencia en sistema: <b>${int(l.cantidad_disponible)}</b> de ${int(l.cantidad_inicial)} recibidas. Usa un ajuste cuando el conteo físico no cuadra.`,
    fields: [
      { name: 'tipo', label: 'Tipo de ajuste', type: 'radio', required: true, value: 'neg', options: [['neg', 'Faltante (−)'], ['pos', 'Sobrante (+)']], full: true },
      { name: 'cantidad', label: 'Cantidad', type: 'int', required: true, gt0: true, min: 1 },
      { name: 'motivo', label: 'Motivo', type: 'textarea', required: true, full: true, placeholder: 'Conteo físico del 15 de noviembre' }
    ],
    onSubmit: async (d) => { await db.rpc('registrar_ajuste', conUsuario({ p_id_lote: l.id_lote, p_positivo: d.tipo === 'pos', p_cantidad: d.cantidad, p_motivo: d.motivo })); toast('Ajuste registrado.'); recargar(); }
  });
}
async function accionLote(accion, l, recargar) {
  try {
    if (accion === 'ver') return verLote(l.id_lote, recargar);
    if (accion === 'editar') return editarLote(l, recargar);
    if (accion === 'merma') return mermaLote(l, recargar);
    if (accion === 'ajuste') return ajusteLote(l, recargar);
    if (accion === 'bloquear') {
      const m = await confirmar({ title: `Bloquear lote ${l.codigo_lote}`, message: 'Un lote bloqueado no se vende hasta que lo desbloquees. Útil para retiros sanitarios o revisión de calidad.', okLabel: 'Bloquear lote', reason: 'Motivo del bloqueo' });
      if (!m) return;
      await db.rpc('lote_bloquear', conUsuario({ p_id: l.id_lote, p_motivo: m })); toast(`Lote ${l.codigo_lote} bloqueado.`);
    }
    if (accion === 'desbloquear') { await db.rpc('lote_desbloquear', conUsuario({ p_id: l.id_lote })); toast(`Lote ${l.codigo_lote} desbloqueado.`); }
    if (accion === 'eliminar') {
      if (!await confirmar({ title: `Eliminar lote ${l.codigo_lote}`, message: 'Solo para capturas erróneas: el lote se borra por completo. Si ya tuvo ventas o mermas no se puede eliminar.', okLabel: 'Eliminar lote', danger: true })) return;
      await db.rpc('lote_eliminar', conUsuario({ p_id: l.id_lote })); toast(`Lote ${l.codigo_lote} eliminado.`);
    }
    closeModal(); recargar();
  } catch (e) { fallo(e); }
}

const TIPO_TXT = { VENTA: 'Venta', MERMA: 'Merma', AJUSTE_NEGATIVO: 'Ajuste −', AJUSTE_POSITIVO: 'Ajuste +', DEVOLUCION: 'Devolución' };
const signo = (t) => ['VENTA', 'MERMA', 'AJUSTE_NEGATIVO'].includes(t) ? '−' : '+';

async function verLote(id, recargar) {
  const ov = openModal({ title: 'Lote', size: 'lg', body: '<div class="loading"><div class="skeleton"></div></div>' });
  try {
    const [l, movs, traz] = await Promise.all([
      db.one('v_lote_detalle', 'id_lote', id),
      db.list('v_movimiento_detalle', { where: [['id_lote', 'eq', id]], order: 'fecha.desc,id_movimiento.desc' }),
      db.list('v_trazabilidad', { where: [['id_lote', 'eq', id]], order: 'fecha.desc' })
    ]);
    $('.modal-head h2', ov).innerHTML = `Lote <span class="mono">${esc(l.codigo_lote)}</span>`;
    $('.modal-body', ov).innerHTML = `
      ${l.estado === 'BLOQUEADO' ? `<div class="notice" style="background:var(--violet-soft);color:var(--violet)"><b>Bloqueado:</b> ${esc(l.motivo_bloqueo)}</div>` : ''}
      ${l.estado === 'VIGENTE' && !l.vendible ? '<div class="notice warn">Este lote tiene menos vida útil de la que exige el producto: FEFO ya no lo toma para vender.</div>' : ''}
      <dl class="facts">
        <div><dt>Producto</dt><dd>${esc(l.producto)} <span class="muted mono">${esc(l.sku)}</span></dd></div>
        <div><dt>Proveedor</dt><dd>${esc(l.proveedor)}</dd></div>
        <div><dt>Caducidad</dt><dd>${fecha(l.fecha_caducidad)} · ${dias(l.dias_restantes)}</dd></div>
        <div><dt>Estado</dt><dd>${pill(l.semaforo)}</dd></div>
        <div><dt>Existencia</dt><dd>${int(l.cantidad_disponible)} de ${int(l.cantidad_inicial)} ${esc(l.unidad)}</dd></div>
        <div><dt>Costo unitario</dt><dd>${money(l.costo_unitario)}</dd></div>
        <div><dt>Valor de existencia</dt><dd>${money(l.valor_existencia)}</dd></div>
        <div><dt>Entrada</dt><dd>${fechaHora(l.fecha_entrada)}</dd></div>
      </dl>
      <h3>Historial de movimientos</h3>
      ${movs.length ? `<div class="table-wrap card"><table><thead><tr><th>Fecha</th><th>Tipo</th><th class="num">Cantidad</th><th>Venta / motivo</th><th class="hide-sm">Usuario</th></tr></thead><tbody>
        ${movs.map((m) => `<tr><td>${fechaHora(m.fecha)}</td><td>${TIPO_TXT[m.tipo]}</td><td class="num">${signo(m.tipo)}${int(m.cantidad)}</td>
        <td>${m.folio ? `<span class="mono">${esc(m.folio)}</span> · ${esc(m.cliente)}` : ''}${m.motivo ? `<div class="muted">${esc(m.motivo)}</div>` : ''}</td><td class="hide-sm">${esc(m.usuario)}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted" style="margin:0">Sin movimientos. Mientras no tenga movimientos puedes corregir cantidad, costo y producto, o eliminarlo.</p>'}
      <h3>Clientes que recibieron este lote</h3>
      ${traz.length ? `<div class="table-wrap card"><table><thead><tr><th>Cliente</th><th>Folio</th><th class="num">Cantidad</th><th>Venta</th></tr></thead><tbody>
        ${traz.map((t) => `<tr><td>${esc(t.cliente)}</td><td class="mono">${esc(t.folio)}</td><td class="num">${int(t.cantidad)}</td><td>${pill(t.estado)}</td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted" style="margin:0">Todavía no se ha vendido nada de este lote.</p>'}`;
    const foot = document.createElement('div');
    foot.className = 'modal-foot';
    foot.innerHTML = `${puede('registros.eliminar') ? btn('eliminar', 'Eliminar', 'trash', 'danger', l.tiene_movimientos ? 'disabled title="Tiene movimientos"' : '') : ''}<span class="spacer"></span>
      ${puede('inventario.ajustar') ? btn('merma', 'Merma', 'drop', '', l.cantidad_disponible > 0 ? '' : 'disabled') + btn('ajuste', 'Ajuste', 'scale') : ''}
      ${puede('lotes.editar') ? (l.estado === 'BLOQUEADO' ? btn('desbloquear', 'Desbloquear', 'unlock') : btn('bloquear', 'Bloquear', 'lock')) + btn('editar', 'Editar', 'edit', 'primary') : ''}`;
    if (puede('registros.eliminar') || puede('inventario.ajustar') || puede('lotes.editar')) $('.modal', ov).append(foot);
    foot.addEventListener('click', (e) => {
      const a = e.target.closest('[data-action]'); if (!a) return;
      if (['editar', 'merma', 'ajuste'].includes(a.dataset.action)) closeModal(ov);
      accionLote(a.dataset.action, l, recargar);
    });
  } catch (e) { $('.modal-body', ov).innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
}

async function paginaLotes() {
  const st = store.get('filtro.lotes', { texto: '', estado: 'existencia', vence: '' });

  view.innerHTML = `
    <div class="page-head"><div><h1>Lotes</h1><p>Cada entrada de mercancía con su caducidad. La existencia solo cambia con ventas, mermas, ajustes y devoluciones.</p></div>
      ${puede('lotes.editar') ? `<button class="btn primary" type="button" id="btnNuevo">${icon('plus')}Entrada de lote</button>` : ''}</div>

      <div class="card-head" style="flex-direction:column;align-items:stretch;gap:12px">

          <label style="display:flex;align-items:center;gap:8px;white-space:nowrap">Vence en ≤ <input class="input" id="vence" type="number" min="0" style="width:84px" value="${esc(st.vence)}" inputmode="numeric" aria-label="Vence en días"> días</label>
          <span class="muted" id="cuenta" style="margin-left:auto"></span>
        </div>
        <div class="chips" role="group" aria-label="Filtrar por semáforo">${FILTROS.map(([v, l]) => `<button class="chip" type="button" data-f="${v}" aria-pressed="${st.estado === v}">${l}</button>`).join('')}</div>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Lote</th><th>Producto</th><th class="hide-sm">Proveedor</th><th class="num">Existencia</th><th class="num">Días</th><th>Semáforo</th><th class="num hide-sm">Valor</th><th class="num">Acciones</th></tr></thead>
      <tbody id="rows">${loadingRow(8)}</tbody></table></div>
    </div>`;
  let datos = [];
  const marca = view.firstElementChild, vivo = () => marca.isConnected;
  const cargar = async () => {
    const where = [];
    if (st.estado === 'existencia') where.push(['cantidad_disponible', 'gt', 0]);
    else if (['ROJO', 'AMARILLO', 'VERDE', 'CADUCADO', 'BLOQUEADO', 'AGOTADO'].includes(st.estado)) where.push(['semaforo', 'eq', st.estado]);
    if (st.vence !== '' && !isNaN(Number(st.vence))) where.push(['dias_restantes', 'lte', Number(st.vence)]);
    const t = limpia(st.texto);
    try {
      datos = await db.list('v_lote_detalle', { where, or: t ? [['codigo_lote', 'ilike', `*${t}*`], ['producto', 'ilike', `*${t}*`], ['proveedor', 'ilike', `*${t}*`], ['sku', 'ilike', `*${t}*`]] : null, order: 'fecha_caducidad.asc,id_lote.asc' });
    } catch (e) { if (vivo()) $('#rows').innerHTML = emptyRow(8, 'No se pudo cargar el listado', ' ' + e.message); return; }
    if (!vivo()) return;
    $('#cuenta').textContent = `${datos.length} ${datos.length === 1 ? 'lote' : 'lotes'}`;
    $('#rows').innerHTML = datos.length ? datos.map((l) => `<tr class="click" data-id="${l.id_lote}">
      <td>${lotLabel(l.codigo_lote, l.fecha_caducidad)}</td><td>${esc(l.producto)}</td><td class="hide-sm">${esc(l.proveedor)}</td>
      <td class="num">${int(l.cantidad_disponible)} <span class="muted">/ ${int(l.cantidad_inicial)}</span></td><td class="num">${dias(l.dias_restantes)}</td>
      <td>${pill(l.semaforo)}</td><td class="num hide-sm">${money(l.valor_existencia)}</td>
      <td><div class="row-actions">${puede('lotes.editar') ? btn('editar', 'Editar', 'edit') : ''}${puede('inventario.ajustar') ? btn('merma', 'Merma', 'drop', '', l.cantidad_disponible > 0 ? '' : 'disabled') : ''}
        ${puede('lotes.editar') ? (l.estado === 'BLOQUEADO' ? btn('desbloquear', 'Desbloquear', 'unlock') : btn('bloquear', 'Bloquear', 'lock')) : ''}
        ${puede('registros.eliminar') ? btn('eliminar', 'Eliminar', 'trash', 'danger', l.tiene_movimientos ? 'disabled title="Tiene movimientos: no se puede eliminar"' : '') : ''}
        ${!puede('lotes.editar') && !puede('inventario.ajustar') ? btn('ver', 'Ver', 'search') : ''}</div></td></tr>`).join('')
      : emptyRow(8, 'No hay lotes con este filtro', ' Cambia el filtro o registra una entrada de lote.');
  };
  const guarda = () => store.set('filtro.lotes', st);
  $('#q').addEventListener('input', debounce((e) => { st.texto = e.target.value; guarda(); cargar(); }));
  $('#vence').addEventListener('input', debounce((e) => { st.vence = e.target.value; guarda(); cargar(); }));
  $$('[data-f]').forEach((b) => b.addEventListener('click', () => { st.estado = b.dataset.f; guarda(); $$('[data-f]').forEach((x) => x.setAttribute('aria-pressed', x === b)); cargar(); }));
  if ($('#btnNuevo')) $('#btnNuevo').addEventListener('click', () => altaLote(cargar));
  $('#rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const l = datos.find((d) => String(d.id_lote) === tr.dataset.id);
    const a = e.target.closest('[data-action]');
    accionLote(a ? a.dataset.action : 'ver', l, cargar);
  });
  await cargar();
}

    const p = productos.find((x) => x.id_producto === id);
    const ex = carrito.find((c) => c.id_producto === id);
    if (ex) ex.cantidad += cant; else carrito.push({ id_producto: id, nombre: p.nombre, sku: p.sku, precio: Number(p.precio_venta), cantidad: cant, imagen_path: p.imagen_path });

      <td><div class="row-actions">${btn('ver', 'Ver', 'search')}${puede('ventas.cancelar') ? btn('cancelar', 'Cancelar', 'ban', 'danger', v.estado === 'CANCELADA' ? 'disabled' : '') : ''}</div></td></tr>`).join('')
      : emptyRow(8, 'Sin ventas con este filtro', ' Cambia las fechas o el texto de búsqueda.');

  const guarda = () => store.set('filtro.ventas', st);
  $('#q').addEventListener('input', debounce((e) => { st.texto = e.target.value; guarda(); cargar(); }));
  $('#desde').addEventListener('change', (e) => { st.desde = e.target.value; guarda(); cargar(); });
  $('#hasta').addEventListener('change', (e) => { st.hasta = e.target.value; guarda(); cargar(); });
  $$('[data-e]').forEach((b) => b.addEventListener('click', () => { st.estado = b.dataset.e; guarda(); $$('[data-e]').forEach((x) => x.setAttribute('aria-pressed', x === b)); cargar(); }));
  $('#rows').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    const v = datos.find((d) => String(d.id_venta) === tr.dataset.id);
    const a = e.target.closest('[data-action]');
    if (a && a.dataset.action === 'cancelar') cancelarVenta(v, () => { cargar(); cargarCombos(); });
    else verVenta(v, () => { cargar(); cargarCombos(); });
  });
  pintaCarrito();
  await Promise.all([cargarCombos(), cargar()]);
}

async function cancelarVenta(v, recargar) {
  const m = await confirmar({ title: `Cancelar venta ${v.folio}`, message: `Venta a <b>${esc(v.cliente)}</b> por <b>${money(v.total)}</b>. Cada unidad regresa al lote del que salió. Una venta cancelada ya no se puede modificar.`,
    okLabel: 'Cancelar venta', danger: true, reason: 'Motivo de la cancelación' });
  if (!m) return;
  try { await db.rpc('venta_cancelar', conUsuario({ p_id_venta: v.id_venta, p_motivo: m })); toast(`Venta ${v.folio} cancelada.`); closeModal(); recargar(); }
  catch (e) { fallo(e); }
}

const TABLA_TXT = { producto: 'Producto', proveedor: 'Proveedor', cliente: 'Cliente', lote: 'Lote', venta: 'Venta', usuario: 'Usuario', rol_permiso: 'Permisos' };
const ACCION_TXT = { ALTA: 'Alta', MODIFICACION: 'Modificación', BAJA: 'Baja', REACTIVACION: 'Reactivación', CAMBIO_ESTADO: 'Cambio de estado', CANCELACION: 'Cancelación', ELIMINACION: 'Eliminación' };
const CAMPO_TXT = { estado: 'Estado', codigo_lote: 'Lote', fecha_caducidad: 'Caducidad', cantidad_inicial: 'Recibido', cantidad_disponible: 'Existencia',
  costo_unitario: 'Costo', motivo_bloqueo: 'Motivo de bloqueo', id_producto: 'Producto #', id_proveedor: 'Proveedor #', sku: 'SKU', nombre: 'Nombre',
  precio_venta: 'Precio', stock_minimo: 'Stock mínimo', dias_minimos_venta: 'Vida mínima (días)', activo: 'Activo', rfc: 'RFC', telefono: 'Teléfono',
  correo: 'Correo', imagen_path: 'Foto', email: 'Correo', id_rol: 'Rol #', rol: 'Rol', permiso: 'Permiso', id_cliente: 'Cliente #', id_unidad: 'Unidad #', motivo_cancelacion: 'Motivo', fecha_cancelacion: 'Cancelada el' };
const OMITIR = new Set(['id_lote', 'id_venta', 'id_usuario', 'auth_id', 'creado_en', 'fecha_entrada', 'fecha', 'usuario']);
const fnFolio = (id) => 'V-' + String(id).padStart(6, '0');
function valorBonito(k, v) {
  if (v === true || v === 'true') return 'Sí';
  if (v === false || v === 'false') return 'No';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return fecha(v);
  if (/^\d{4}-\d{2}-\d{2}T/.test(v)) return fechaHora(v);
  if (['costo_unitario', 'precio_venta'].includes(k) && !isNaN(Number(v))) return money(v);
  if (k === 'estado') return ESTADO_TXT[v] || v;
  return v;
}
function detalleBonito(a) {
  const txt = String(a.detalle || '');
  let pares = [];
  if (txt.trim().startsWith('{')) {               // formato anterior (JSON)
    try { pares = Object.entries(JSON.parse(txt)).map(([k, v]) => [k, v == null ? null : String(v)]); }
    catch { pares = [...txt.matchAll(/"([a-z_]+)":\s*"?([^",}]*)"?/g)].map((m) => [m[1], m[2] === 'null' ? null : m[2]]); }
  } else {
    pares = txt.split('; ').filter(Boolean).map((seg) => { const i = seg.indexOf(': '); return i < 0 ? ['', seg] : [seg.slice(0, i), seg.slice(i + 2)]; });
  }
  const items = pares.filter(([k, v]) => !OMITIR.has(k) && v != null && v !== '')
    .map(([k, v]) => {
      const etiqueta = CAMPO_TXT[k] || k;
      const flecha = String(v).split(' → ');
      const val = flecha.length === 2
        ? `<span class="muted">${esc(valorBonito(k, flecha[0] === '∅' ? '—' : flecha[0]))}</span> → <b>${esc(valorBonito(k, flecha[1] === '∅' ? '—' : flecha[1]))}</b>`
        : esc(valorBonito(k, v));
      return `<span class="kv">${k ? `<span class="muted">${esc(etiqueta)}:</span> ` : ''}${val}</span>`;
    });
  return items.length ? `<div class="kvs">${items.join('')}</div>` : '<span class="muted">—</span>';
}

/* =====================================================================
   REPORTEADOR
   ===================================================================== */
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const sumaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const PRESETS = {
  hoy: () => [hoyISO(), hoyISO()],
  semana: () => [sumaDias(hoyISO(), -6), hoyISO()],
  mes: () => [hoyISO().slice(0, 8) + '01', hoyISO()],
  anterior: () => { const ini = new Date(hoyISO().slice(0, 8) + '01T12:00:00'); ini.setMonth(ini.getMonth() - 1);
    const a = ini.toISOString().slice(0, 10); const fin = sumaDias(hoyISO().slice(0, 8) + '01', -1); return [a, fin]; },
  anio: () => [hoyISO().slice(0, 4) + '-01-01', hoyISO()]
};
const sum = (rows, k) => rows.reduce((a, r) => a + Number(r[k] || 0), 0);

TIPO_TXT.ENTRADA = 'Entrada';

function celda(v, f) {
  if (v == null || v === '') return f === 'bool' ? '' : '<span class="muted">—</span>';
  switch (f) {
    case 'money': return money(v);
    case 'int': return int(v);
    case 'pct': return Number(v).toFixed(1) + ' %';
    case 'date': return fecha(String(v).slice(0, 10));
    case 'datetime': return fechaHora(v);
    case 'mono': return `<span class="mono">${esc(v)}</span>`;
    case 'estado': return pill(v);
    case 'tipo': return esc(TIPO_TXT[v] || v);
    case 'dias': return dias(v);
    case 'bool': return v ? '<span class="tag" style="margin:0">Reordenar</span>' : '';
    default: return esc(v);
  }
}
function csvValor(v, f) {
  if (v == null) return '';
  if (f === 'bool') return v ? 'Sí' : 'No';
  if (f === 'datetime') { const d = new Date(v); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16).replace('T', ' '); }
  if (f === 'tipo') return TIPO_TXT[v] || v;
  return String(v);
}
const niceMax = (m) => { if (m <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(m))); const f = m / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; };
const moneyCorto = (n) => n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + ' M' : n >= 1e3 ? '$' + (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + ' k' : '$' + Math.round(n);

function graficaDias(rows) {
  const max = niceMax(Math.max(...rows.map((r) => Number(r.importe))));
  const n = rows.length, cada = Math.max(1, Math.ceil(n / 8));
  const dd = (iso) => { const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' }); };
  return `<figure class="chart" aria-label="Importe vendido por día">
    <figcaption class="chart-title">Importe vendido por día</figcaption>
    <div class="chart-body">
      <div class="chart-y">${[max, max / 2, 0].map((v) => `<span>${moneyCorto(v)}</span>`).join('')}</div>
      <div class="chart-plot">
        <div class="chart-grid"><i></i><i></i><i></i></div>
        <div class="chart-cols">${rows.map((r) => `<div class="col" data-tip="${esc(fecha(r.dia))}|${esc(money(r.importe))}|${int(r.ventas)} ${Number(r.ventas) === 1 ? 'venta' : 'ventas'}">
          <span style="height:${(100 * Number(r.importe) / max).toFixed(2)}%"></span></div>`).join('')}</div>
      </div>
    </div>
    <div class="chart-x">${rows.map((r, i) => `<span>${i % cada === 0 || i === n - 1 ? esc(dd(r.dia)) : ''}</span>`).join('')}</div>
  </figure>`;
}
function graficaBarras(rows, { label, valor, titulo }) {
  const top = [...rows].filter((r) => Number(r[valor]) > 0).sort((a, b) => b[valor] - a[valor]).slice(0, 10);
  if (!top.length) return '';
  const max = Number(top[0][valor]);
  return `<figure class="chart" aria-label="${esc(titulo)}"><figcaption class="chart-title">${esc(titulo)}${rows.length > 10 ? ' · 10 principales' : ''}</figcaption>
    <div class="hbars">${top.map((r) => `<div class="hbar" data-tip="${esc(r[label])}|${esc(money(r[valor]))}">
      <span class="hbar-l">${esc(r[label])}</span><span class="hbar-t"><span style="width:${Math.max(1, 100 * r[valor] / max).toFixed(2)}%"></span></span>
      <span class="hbar-v">${money(r[valor])}</span></div>`).join('')}</div></figure>`;
}

async function paginaReportes() {
  const st = store.get('reporte', { id: 'ventas', preset: 'mes', desde: '', hasta: '', dias: 30, producto: '', canceladas: false });
  if (st.preset && PRESETS[st.preset]) [st.desde, st.hasta] = PRESETS[st.preset]();
  if (!st.desde) [st.desde, st.hasta] = PRESETS.mes();
  view.innerHTML = `
    <div class="page-head no-print"><div><h1>Reportes</h1><p>Elige un reporte, ajusta el periodo y genera. Puedes exportarlo a Excel (CSV) o imprimirlo / guardarlo como PDF.</p></div></div>

  let ultimo = null, productos = [];
  const R = () => REPORTES.find((r) => r.id === st.id) || REPORTES[0];
  const guarda = () => store.set('reporte', st);

  const pintaParams = () => {
    const r = R(), ps = r.params;
    $('#params').innerHTML = `
      ${ps.includes('periodo') ? `<div class="rep-group"><span class="label">Periodo</span>
        <div class="chips">${[['hoy', 'Hoy'], ['semana', '7 días'], ['mes', 'Este mes'], ['anterior', 'Mes anterior'], ['anio', 'Este año']].map(([k, l]) => `<button type="button" class="chip" data-preset="${k}" aria-pressed="${st.preset === k}">${l}</button>`).join('')}</div>
        <div class="rep-dates"><label>Desde <input class="input" type="date" id="pDesde" value="${st.desde}"></label><label>Hasta <input class="input" type="date" id="pHasta" value="${st.hasta}"></label></div></div>` : ''}
      ${ps.includes('dias') ? `<div class="rep-group"><span class="label">Vencen en los próximos</span><div class="rep-dates"><label><input class="input" type="number" id="pDias" min="0" max="3650" value="${st.dias}" style="width:100px" inputmode="numeric"> días</label></div></div>` : ''}
      ${ps.includes('producto') ? `<div class="rep-group"><span class="label">Producto</span><select class="input" id="pProd" style="min-width:240px"><option value="">Todos los productos</option>
        ${productos.map((p) => `<option value="${p.id_producto}"${String(p.id_producto) === String(st.producto) ? ' selected' : ''}>${esc(p.nombre)} · ${esc(p.sku)}</option>`).join('')}</select></div>` : ''}
      ${ps.includes('canceladas') ? `<label class="rep-check"><input type="checkbox" id="pCanc"${st.canceladas ? ' checked' : ''}> Incluir canceladas</label>` : ''}
      ${!ps.length ? '<div class="rep-group"><span class="label">Fecha de corte</span><span>Hoy, ' + fecha(hoyISO()) + '</span></div>' : ''}
      <div class="rep-actions"><button class="btn primary" type="button" id="btnGen">${icon('play')}Generar</button>
        <button class="btn" type="button" id="btnCsv" disabled>${icon('log')}Exportar CSV</button>
        <button class="btn" type="button" id="btnPrint" disabled>${icon('archive')}Imprimir / PDF</button></div>`;
    $$('[data-preset]', $('#params')).forEach((b) => b.addEventListener('click', () => {
      st.preset = b.dataset.preset; [st.desde, st.hasta] = PRESETS[st.preset](); guarda(); pintaParams(); generar();
    }));
    const onDate = () => { st.desde = $('#pDesde').value; st.hasta = $('#pHasta').value; st.preset = ''; guarda(); $$('[data-preset]').forEach((x) => x.setAttribute('aria-pressed', 'false')); };
    if ($('#pDesde')) { $('#pDesde').addEventListener('change', onDate); $('#pHasta').addEventListener('change', onDate); }
    if ($('#pDias')) $('#pDias').addEventListener('change', (e) => { st.dias = e.target.value; guarda(); });
    if ($('#pProd')) $('#pProd').addEventListener('change', (e) => { st.producto = e.target.value; guarda(); generar(); });
    if ($('#pCanc')) $('#pCanc').addEventListener('change', (e) => { st.canceladas = e.target.checked; guarda(); generar(); });
    $('#btnGen').addEventListener('click', generar);
    $('#btnCsv').addEventListener('click', exportar);
    $('#btnPrint').addEventListener('click', () => window.print());
    if (ultimo && ultimo.r.id === st.id) { $('#btnCsv').disabled = false; $('#btnPrint').disabled = false; }
  };

  const generar = async () => {
    const r = R();
    const p = { desde: st.desde, hasta: st.hasta, dias: parseInt(st.dias, 10), producto: st.producto, canceladas: !!st.canceladas };
    if (r.params.includes('periodo')) {
      if (!p.desde || !p.hasta) return toast('Elige la fecha inicial y final del periodo.', true);
      if (p.desde > p.hasta) return toast('La fecha "Desde" debe ser anterior o igual a "Hasta".', true);
    }
    if (r.params.includes('dias') && !(p.dias >= 0)) return toast('Escribe un número de días válido.', true);
    $('#salida').innerHTML = '<div class="card loading"><div class="skeleton" style="max-width:420px;margin:0 auto"></div></div>';
    $('#btnCsv').disabled = true; $('#btnPrint').disabled = true;
    try {
      const [rows, porDia] = await Promise.all([db.rpc(r.rpc, r.args(p)), r.dias ? db.rpc('rpt_ventas_dia', { p_desde: p.desde, p_hasta: p.hasta }) : null]);
      if (!marca.isConnected || R().id !== r.id) return;
      ultimo = { r, p, rows };
      const parametros = [
        r.params.includes('periodo') ? `Periodo: ${fecha(p.desde)} al ${fecha(p.hasta)}` : '',
        r.params.includes('dias') ? `Vencen en ${p.dias} días o menos` : '',
        r.params.includes('producto') ? `Producto: ${p.producto ? esc((productos.find((x) => String(x.id_producto) === String(p.producto)) || {}).nombre || '') : 'todos'}` : '',
        r.params.includes('canceladas') ? (p.canceladas ? 'Incluye canceladas' : 'Sin canceladas') : '',
        !r.params.length ? `Corte al ${fecha(hoyISO())}` : ''
      ].filter(Boolean).join(' · ');
      const cols = r.cols, totCols = cols.filter((c) => c[3]);
      const resumen = r.resumen(rows, p);
      $('#salida').innerHTML = `<article class="card rep-out">
        <header class="rep-head">
          <div class="print-only rep-brand"><b>LoteSmart</b> · Inventario por lotes FEFO</div>
          <div><h2>${esc(r.titulo)}</h2><p class="muted" style="margin:4px 0 0">${parametros}</p></div>
          <p class="muted rep-meta">Generado por ${esc(auth.nombre)} · ${fechaHora(new Date().toISOString())}</p>
        </header>
        <div class="rep-kpis">${resumen.map(([k, v, d]) => `<div><span class="label">${esc(k)}</span><b>${v}</b>${d ? `<small class="muted">${esc(d)}</small>` : ''}</div>`).join('')}</div>
        ${rows.length && porDia && porDia.some((x) => Number(x.importe) > 0) ? graficaDias(porDia) : ''}
        ${rows.length && r.barras ? graficaBarras(rows, r.barras) : ''}
        <div class="table-wrap"><table class="rep-table"><thead><tr>${cols.map(([k, t, f, , cls]) => `<th class="${['money', 'int', 'pct', 'dias'].includes(f) ? 'num' : ''} ${cls || ''}">${esc(t)}</th>`).join('')}</tr></thead>
          <tbody>${rows.length ? rows.map((x) => `<tr>${cols.map(([k, , f, , cls]) => `<td class="${['money', 'int', 'pct', 'dias'].includes(f) ? 'num' : ''} ${cls || ''}">${celda(x[k], f)}</td>`).join('')}</tr>`).join('')
            : emptyRow(cols.length, 'Sin datos para estos parámetros', ' Prueba con otro periodo.')}</tbody>
          ${rows.length && totCols.length ? `<tfoot><tr>${cols.map(([k, t, f, tot, cls], i) => `<td class="${['money', 'int', 'pct', 'dias'].includes(f) ? 'num' : ''} ${cls || ''}">${tot ? celda(sum(rows, k), f) : i === 0 ? 'Totales' : ''}</td>`).join('')}</tr></tfoot>` : ''}
        </table></div>
        <footer class="rep-foot muted">${int(rows.length)} ${rows.length === 1 ? 'renglón' : 'renglones'}</footer>
      </article>`;
      $('#btnCsv').disabled = !rows.length; $('#btnPrint').disabled = false;
    } catch (e) { if (marca.isConnected) $('#salida').innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  };

  const exportar = () => {
    if (!ultimo) return;
    const { r, p, rows } = ultimo;
    const q = (v) => /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    const lineas = [r.cols.map((c) => q(c[1])).join(','), ...rows.map((x) => r.cols.map(([k, , f]) => q(csvValor(x[k], f))).join(','))];
    const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lotesmart_${r.id}_${r.params.includes('periodo') ? p.desde + '_' + p.hasta : hoyISO()}.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Reporte exportado.');
  };

  $$('[data-rep]').forEach((b) => b.addEventListener('click', () => {
    st.id = b.dataset.rep; guarda(); ultimo = null;
    $$('[data-rep]').forEach((x) => x.setAttribute('aria-selected', x === b));
    pintaParams(); generar();
  }));
  try { productos = await db.list('producto', { select: 'id_producto,sku,nombre', order: 'nombre.asc' }); } catch {}
  if (!marca.isConnected) return;
  pintaParams();
  generar();
}

/* Tooltip de las gráficas */
const tip = document.createElement('div');
tip.className = 'tip'; tip.hidden = true; document.body.append(tip);
document.addEventListener('mouseover', (e) => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  const [a, b, c] = t.dataset.tip.split('|');
  tip.innerHTML = `<b>${a}</b><span>${b}</span>${c ? `<small>${c}</small>` : ''}`;
  tip.hidden = false;
  const r = t.getBoundingClientRect();
  const x = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
  const y = r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });
