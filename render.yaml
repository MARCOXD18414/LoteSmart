# Render: sitio estático gratuito (no se "duerme" como los web services).
# En Render: New → Blueprint → elige este repositorio → Apply.
services:
  - type: web
    name: lotesmart
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
